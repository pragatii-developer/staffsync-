  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; box-shadow: 0 4px 12px rgba(15,23,42,0.04); }

  .kanban-col { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; }
